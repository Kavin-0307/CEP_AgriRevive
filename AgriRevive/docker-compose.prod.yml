version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrirevive-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agrirevive_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agrirevive_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agri-network

  redis:
    image: redis:7-alpine
    container_name: agrirevive-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agri-network

  kafka:
    image: apache/kafka:latest
    container_name: agrirevive-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "4L622nShTUiBenA3heKdRw"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    restart: unless-stopped
    networks:
      - agri-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agrirevive-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrirevive_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: "4KYQDrqkdI4WhZ+59TQavg4ySySUM3uohcx0ZHvml/Y="
      APP_JWT_EXPIRATIONS: 86400000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - agri-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrirevive-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agri-network

volumes:
  postgres-data:
  redis-data:

networks:
  agri-network:
    driver: bridge
